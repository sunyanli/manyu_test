server:
  port: 8080

spring:
  application:
    name: todo-service
  datasource:
    # 创建走主库；账号口令由配置中心/环境变量注入，禁止硬编码
    url: jdbc:mysql://${TODO_DB_HOST:127.0.0.1}:${TODO_DB_PORT:3306}/${TODO_DB_NAME:todo}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${TODO_DB_USER:todo_app}
    password: ${TODO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 1000
      validation-timeout: 1000

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false
    default-statement-timeout: 1

# 登录态：true 时要求网关注入票据头并二次校验；网关已完成校验时保持 false
auth:
  verify:
    enabled: false

todo:
  create:
    # 单用户每分钟创建次数上限（R11）
    rate-limit-per-minute: 30

logging:
  level:
    root: info
    com.antdigital.todo: info
