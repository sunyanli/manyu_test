server:
  port: 8080

spring:
  application:
    name: demo-server
  datasource:
    url: jdbc:h2:mem:demo_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.alipay.xchain: debug

# CORS 跨域配置（开发环境默认全通配，生产环境限定白名单，逗号分隔）
cors:
  allowed-origins: "*"

# 演示模块配置
demo:
  export:
    limit: 1000