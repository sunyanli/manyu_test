server:
  port: 8080

spring:
  application:
    name: algorithm-demo
  datasource:
    url: jdbc:mysql://localhost:3306/algorithm_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.algorithmdemo.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 埋点配置
tracking:
  enabled: true
  async: true

logging:
  level:
    com.example.algorithmdemo: DEBUG