spring:
  application:
    name: todo-app
  datasource:
    url: jdbc:mysql://localhost:3306/todo_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dtazzy.todo.dao.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

logging:
  level:
    com.dtazzy.todo: INFO