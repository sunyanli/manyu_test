server:
  port: 8080

spring:
  application:
    name: algorithm-demo
  datasource:
    url: jdbc:mysql://localhost:3306/algorithm_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

tracking:
  enabled: true

export:
  enabled: true
  max-records: 10000