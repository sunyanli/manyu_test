server:
  port: 8080

spring:
  application:
    name: todo-service
  datasource:
    # 创建走主库；账号口令由配置中心/环境变量注入，禁止硬编码
    url: jdbc:mysql://${TODO_DB_HOST:127.0.0.1}:${TODO_DB_PORT:3306}/${TODO_DB_NAME:todo}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${TODO_DB_USER:todo_app}
    password: ${TODO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 1000
      validation-timeout: 1000

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false
    default-statement-timeout: 1

# 登录态与身份可信：网关注入的身份/权限头必须带 HMAC-SHA256 签名，缺失或校验失败一律 TODO_0005。
# 签名密钥由配置中心注入；未配置密钥时校验必然失败（fail-closed），禁止在生产环境关闭校验。
auth:
  gateway:
    verify:
      enabled: ${AUTH_GATEWAY_VERIFY_ENABLED:true}
    sign-secret: ${AUTH_GATEWAY_SIGN_SECRET:}
    # 网关时间戳允许的偏差（秒），超出视为重放请求
    timestamp-tolerance-seconds: ${AUTH_GATEWAY_TIMESTAMP_TOLERANCE:300}

todo:
  create:
    # 功能总开关（系分 §7.3 一级应急：关闭即可止血，无需回滚）
    enabled: ${TODO_CREATE_ENABLED:true}
    # 灰度：租户 ID 尾号白名单，逗号分隔（如 "1,3,5"）；留空表示全量开放（系分 §7.2）
    gray:
      tenants: ${TODO_CREATE_GRAY_TENANTS:}
    # 单用户每分钟创建次数上限（R11，单实例口径；集群限额由网关层保证）
    rate-limit-per-minute: ${TODO_CREATE_RATE_LIMIT:30}
  no:
    # 雪花节点 ID：多副本部署必须为每个实例注入唯一组合（系分 §5.1 支撑层「多实例下不重复」）
    worker-id: ${TODO_NO_WORKER_ID:0}
    datacenter-id: ${TODO_NO_DATACENTER_ID:0}

# 可监控：暴露指标端点供 Prometheus 抓取（系分 §6.5）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
    com.antdigital.todo: info
