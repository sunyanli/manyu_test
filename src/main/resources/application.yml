server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/algorithm_demo?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.algorithm.model.entity

logging:
  level:
    com.example.algorithm.mapper: debug

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
