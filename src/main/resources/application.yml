server:
  port: 8080

spring:
  application:
    name: org-service
  datasource:
    url: jdbc:mysql://localhost:3306/org_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:org-service-jwt-secret-key-must-be-at-least-256-bits-long}
  expiration: 86400000

logging:
  level:
    com.example.org: DEBUG