<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 32px 28px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1::before {
            content: "📋";
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #4f6ef7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 11px 0;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4f6ef7;
            color: #fff;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #3b5de7;
        }

        .btn:active {
            background: #2f4fd4;
        }

        .toast {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .toast.success {
            display: block;
            background: #e6f7e6;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .toast.error {
            display: block;
            background: #fdecea;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .hint {
            margin-top: 4px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>新增待办事项</h1>

        <form id="todoForm" autocomplete="off">
            <div class="form-group">
                <label for="title">事项名称 <span style="color:#c62828;">*</span></label>
                <input type="text" id="title" placeholder="请输入待办事项名称" maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="description">描述</label>
                <textarea id="description" placeholder="请输入事项详情（选填）" maxlength="500"></textarea>
            </div>

            <button type="submit" class="btn">保存待办</button>
        </form>

        <div id="toast" class="toast"></div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('todoForm');
            const titleInput = document.getElementById('title');
            const descInput = document.getElementById('description');
            const toast = document.getElementById('toast');

            const STORAGE_KEY = 'aiwork_todos';

            function getTodos() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    return data ? JSON.parse(data) : [];
                } catch {
                    return [];
                }
            }

            function saveTodo(todo) {
                const todos = getTodos();
                todos.push(todo);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
            }

            function showToast(message, type) {
                toast.textContent = message;
                toast.className = 'toast ' + type;
                setTimeout(() => {
                    toast.className = 'toast';
                }, 3000);
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const title = titleInput.value.trim();
                if (!title) {
                    showToast('请输入事项名称', 'error');
                    titleInput.focus();
                    return;
                }

                const todo = {
                    id: Date.now(),
                    title: title,
                    description: descInput.value.trim(),
                    createdAt: new Date().toISOString()
                };

                saveTodo(todo);
                showToast('✅ 添加成功！', 'success');
                form.reset();
                titleInput.focus();
            });
        })();
    </script>
</body>
</html>
